<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">CNN Architecture (CIFAR-10 Classification)</text>

  <!-- Layer definitions: x, width, color, label lines -->
  <!-- Input -->
  <g>
    <rect x="20" y="150" width="70" height="140" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="55" y="220" font-size="12" text-anchor="middle" fill="#1e3a8a">Input</text>
    <text x="55" y="235" font-size="10" text-anchor="middle" fill="#1e3a8a">32×32×3</text>
  </g>

  <!-- Arrow -->
  <text x="105" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Conv1 -->
  <g>
    <rect x="120" y="130" width="80" height="180" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="4"/>
    <text x="160" y="210" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532d">Conv2D #1</text>
    <text x="160" y="225" font-size="9" text-anchor="middle" fill="#14532d">3×3, 32 filters</text>
    <text x="160" y="238" font-size="9" text-anchor="middle" fill="#14532d">ReLU</text>
    <text x="160" y="255" font-size="9" text-anchor="middle" fill="#166534">32×32×32</text>
  </g>

  <text x="215" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Pool1 -->
  <g>
    <rect x="230" y="150" width="70" height="140" fill="#fef9c3" stroke="#eab308" stroke-width="2" rx="4"/>
    <text x="265" y="210" font-size="11" font-weight="bold" text-anchor="middle" fill="#713f12">MaxPool #1</text>
    <text x="265" y="225" font-size="9" text-anchor="middle" fill="#713f12">2×2</text>
    <text x="265" y="245" font-size="9" text-anchor="middle" fill="#854d0e">16×16×32</text>
  </g>

  <text x="315" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Conv2 -->
  <g>
    <rect x="330" y="120" width="80" height="200" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="4"/>
    <text x="370" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532d">Conv2D #2</text>
    <text x="370" y="220" font-size="9" text-anchor="middle" fill="#14532d">3×3, 64 filters</text>
    <text x="370" y="233" font-size="9" text-anchor="middle" fill="#14532d">ReLU</text>
    <text x="370" y="250" font-size="9" text-anchor="middle" fill="#166534">16×16×64</text>
  </g>

  <text x="425" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Pool2 -->
  <g>
    <rect x="440" y="150" width="70" height="140" fill="#fef9c3" stroke="#eab308" stroke-width="2" rx="4"/>
    <text x="475" y="210" font-size="11" font-weight="bold" text-anchor="middle" fill="#713f12">MaxPool #2</text>
    <text x="475" y="225" font-size="9" text-anchor="middle" fill="#713f12">2×2</text>
    <text x="475" y="245" font-size="9" text-anchor="middle" fill="#854d0e">8×8×64</text>
  </g>

  <text x="525" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Conv3 -->
  <g>
    <rect x="540" y="130" width="80" height="180" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="4"/>
    <text x="580" y="210" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532d">Conv2D #3</text>
    <text x="580" y="225" font-size="9" text-anchor="middle" fill="#14532d">3×3, 64 filters</text>
    <text x="580" y="238" font-size="9" text-anchor="middle" fill="#14532d">ReLU</text>
    <text x="580" y="255" font-size="9" text-anchor="middle" fill="#166534">8×8×64</text>
  </g>

  <text x="635" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Flatten -->
  <g>
    <rect x="650" y="160" width="70" height="120" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="685" y="215" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">Flatten</text>
    <text x="685" y="235" font-size="9" text-anchor="middle" fill="#6b21a8">4096</text>
  </g>

  <text x="735" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Dense1 -->
  <g>
    <rect x="750" y="170" width="70" height="100" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="785" y="210" font-size="11" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Dense #1</text>
    <text x="785" y="225" font-size="9" text-anchor="middle" fill="#7f1d1d">64, ReLU</text>
  </g>

  <text x="835" y="225" font-size="18" text-anchor="middle" fill="#666">→</text>

  <!-- Dense2 -->
  <g>
    <rect x="850" y="180" width="80" height="80" fill="#fecdd3" stroke="#e11d48" stroke-width="2" rx="4"/>
    <text x="890" y="210" font-size="11" font-weight="bold" text-anchor="middle" fill="#881337">Dense #2</text>
    <text x="890" y="225" font-size="9" text-anchor="middle" fill="#881337">10, Softmax</text>
    <text x="890" y="240" font-size="8" text-anchor="middle" fill="#9f1239">(Output)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 350)">
    <rect x="0" y="0" width="16" height="16" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="22" y="13" font-size="11" fill="#333">Input</text>

    <rect x="90" y="0" width="16" height="16" fill="#dcfce7" stroke="#22c55e"/>
    <text x="112" y="13" font-size="11" fill="#333">Convolution + ReLU</text>

    <rect x="260" y="0" width="16" height="16" fill="#fef9c3" stroke="#eab308"/>
    <text x="282" y="13" font-size="11" fill="#333">Max Pooling</text>

    <rect x="400" y="0" width="16" height="16" fill="#f3e8ff" stroke="#a855f7"/>
    <text x="422" y="13" font-size="11" fill="#333">Flatten</text>

    <rect x="490" y="0" width="16" height="16" fill="#fee2e2" stroke="#ef4444"/>
    <text x="512" y="13" font-size="11" fill="#333">Fully Connected (Dense)</text>

    <rect x="700" y="0" width="16" height="16" fill="#fecdd3" stroke="#e11d48"/>
    <text x="722" y="13" font-size="11" fill="#333">Output Layer</text>
  </g>

  <text x="500" y="400" font-size="12" text-anchor="middle" fill="#666">Feature Extraction (Conv + Pool) → Flatten → Classification (Dense)</text>
  <text x="500" y="425" font-size="11" text-anchor="middle" fill="#888">Dataset: CIFAR-10 · Loss: Cross-Entropy · Optimizer: Adam</text>
</svg>
